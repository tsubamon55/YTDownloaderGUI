<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="480" rx="224" fill="url(#gloss)"/>
  <!-- screen -->
  <g filter="url(#shadow)">
    <rect x="212" y="170" width="600" height="380" rx="70" fill="#F8FAFC"/>
  </g>
  <path d="M450 262 L450 458 L622 360 Z" fill="#4F46E5" stroke="#4F46E5" stroke-width="28" stroke-linejoin="round"/>
  <!-- download badge -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="700" r="170" fill="url(#badge)" stroke="#4F46E5" stroke-width="30"/>
  </g>
  <rect x="480" y="596" width="64" height="112" rx="20" fill="#fff"/>
  <path d="M410 692 L614 692 L512 800 Z" fill="#fff" stroke="#fff" stroke-width="26" stroke-linejoin="round"/>
</svg>
