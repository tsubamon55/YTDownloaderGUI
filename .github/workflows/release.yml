name: Release

# v1.2.3 形式のタグをpushすると、WindowsインストーラーとmacOS用dmgをビルドして
# GitHub Releasesの下書きに添付する。
# 公開(下書き解除)した時点で既存ユーザーの自動アップデートが始まるため、公開は手動で行う
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # updater.pyはtag_nameとVERSIONを比較するため、食い違うと更新を繰り返し促してしまう
      - id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} がVERSIONファイル (${version}) と一致しません"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  build-windows:
    needs: [check-version, ci]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # PyInstallerもロックファイルでバージョンを固定している
      - run: python -m pip install -r requirements-dev.txt

      # licenses/FFMPEG_NOTICE.mdに書いてある通り、Gyan.DevのEssentials Buildを同梱する。
      # 配布物に入れてアップデートで全ユーザーに届くため、版を固定し、ハッシュが一致しなければ失敗させる。
      # 更新するときは、URLの版と下のハッシュを一緒に書き換える
      # (GyanD/codexffmpegはGyan.Dev公式のGitHubミラーで、版ごとのURLが消えない)
      - name: Download ffmpeg
        shell: pwsh
        env:
          FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
          FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
        run: |
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:FFMPEG_SHA256) {
            Write-Error "ffmpeg.zipのハッシュが一致しません: $actual"
            exit 1
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          $bin = Get-ChildItem ffmpeg_extract -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe", "$($bin.FullName)\ffprobe.exe" ffmpeg\

      - run: pyinstaller YTDownloaderGUI.spec --noconfirm

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          path: installer_output/YTDownloaderGUI-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error

  build-macos:
    needs: [check-version, ci]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # PyInstallerもロックファイルでバージョンを固定している
      - run: python -m pip install -r requirements-dev.txt

      # 他のMacでも動くよう、Homebrew版(共有ライブラリに依存)ではなく静的ビルドを同梱する。
      # Windowsと同じ理由で版を固定し、ハッシュが一致しなければ失敗させる。
      # 更新するときは、FFMPEG_BUILDと下のハッシュを一緒に書き換える
      - name: Download ffmpeg
        env:
          FFMPEG_BUILD: https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2
        run: |
          mkdir -p ffmpeg
          for tool in ffmpeg ffprobe; do
            curl -fsSL -o "${tool}.zip" "${FFMPEG_BUILD}/${tool}.zip"
          done
          shasum -a 256 -c - <<'SUMS'
          c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924  ffmpeg.zip
          fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6  ffprobe.zip
          SUMS
          for tool in ffmpeg ffprobe; do
            unzip -o "${tool}.zip" -d ffmpeg
          done
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe
          ffmpeg/ffmpeg -version | head -n 1

      # READMEの「アプリアイコン」と同じ手順で.icnsを生成する
      - name: Generate icns
        run: |
          ICONSET=downloader-icon/app-icon.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z $size $size downloader-icon/app-icon-1024.png --out "$ICONSET/icon_${size}x${size}.png"
            sips -z $((size * 2)) $((size * 2)) downloader-icon/app-icon-1024.png --out "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o downloader-icon/app-icon.icns
          rm -rf "$ICONSET"

      - run: pyinstaller YTDownloaderGUI.spec --noconfirm

      - name: Build dmg
        run: |
          mkdir -p dist/dmg_staging
          ln -s /Applications dist/dmg_staging/Applications
          cp -R dist/YTDownloaderGUI.app dist/dmg_staging/
          hdiutil create -volname "YTDownloaderGUI" -srcfolder dist/dmg_staging -ov -format UDZO "dist/YTDownloaderGUI-${VERSION}.dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-dmg
          path: dist/YTDownloaderGUI-${{ env.VERSION }}.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      # 利用者やアップデーターが配布物の破損・差し替えを確かめられるよう、チェックサムも添付する
      - name: Generate checksums
        working-directory: assets
        run: sha256sum -- * > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft
