name: CI

on:
  push:
    branches: [master]
  pull_request:
  # release.ymlからビルド前のチェックとして呼び出す
  workflow_call:

# GITHUB_TOKENの権限はリポジトリ設定の既定値に任せず、読み取りだけに絞る
permissions:
  contents: read

# actionはタグではなくコミットSHAで固定する(タグは後から別のコミットに付け替えられるため)
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # ruffだけで足りるため、ロックファイルのバージョンに合わせてそれだけを入れる
      - run: python -m pip install -c requirements-dev.txt ruff
      - run: python -m ruff check src tests

  test:
    # 配布対象のOS(Windows/macOS)で実行する。pywin32のようにOSで入る依存が変わるため、
    # mypyもOSごとに走らせる
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # ランナーには画面が無いため、Qtをオフスクリーンで動かす
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m mypy
      - run: python -m unittest discover -s tests
