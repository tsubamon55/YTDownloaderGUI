name: CI

on:
  push:
    branches: [master]
  pull_request:
  # release.ymlからビルド前のチェックとして呼び出す
  workflow_call:

# GITHUB_TOKENの権限はリポジトリ設定の既定値に任せず、読み取りだけに絞る
permissions:
  contents: read

# 同じブランチ・PRに続けてpushした場合は、古い方の実行を止めて新しい方だけを走らせる。
# (release.ymlから呼ばれた場合は呼び出し元のワークフロー名が入るため、通常のCIとは別枠になる)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actionはタグではなくコミットSHAで固定する(タグは後から別のコミットに付け替えられるため)
jobs:
  lint:
    runs-on: ubuntu-latest
    # 何かが固まった場合に、既定の6時間ランナーを占有し続けないようにする
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # ruffとuvだけで足りるため、ロックファイルのバージョンに合わせてそれだけを入れる
      - run: python -m pip install -c requirements-dev.txt ruff uv
      - run: python -m ruff check src tests
      # .inを編集したままロックファイルを再生成し忘れると、CIもリリースも古い依存のまま
      # 通ってしまう。既存のロックファイルの版を優先して生成し直し、内容が変わらないことを確かめる
      # (先頭の生成コマンドのコメントは出力先のパスを含むため比較から除く)
      - name: Check lock files are up to date
        run: |
          for name in requirements requirements-dev; do
            cp "${name}.txt" "${RUNNER_TEMP}/${name}.txt"
            python -m uv pip compile "${name}.in" -o "${RUNNER_TEMP}/${name}.txt" \
              --universal --python-version 3.13 --generate-hashes --quiet
            if ! diff <(grep -v '^#' "${name}.txt") <(grep -v '^#' "${RUNNER_TEMP}/${name}.txt"); then
              echo "::error::${name}.txt が ${name}.in と一致しません。README「依存関係の更新」の手順で再生成してください"
              exit 1
            fi
          done

  test:
    # 配布対象のOS(Windows/macOS)で実行する。pywin32のようにOSで入る依存が変わるため、
    # mypyもOSごとに走らせる
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # ランナーには画面が無いため、Qtをオフスクリーンで動かす
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m mypy
      - run: python -m unittest discover -s tests
